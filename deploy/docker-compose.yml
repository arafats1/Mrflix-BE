# Mrflix backend (Strapi) + MySQL on the Contabo VPS.
#
# Used on the server from /opt/mrflix/src (synced there by GitHub Actions):
#   docker compose -f deploy/docker-compose.yml \
#     --env-file /opt/mrflix/.env --env-file /opt/mrflix/db.env up -d --build
#
# /opt/mrflix/.env    app secrets (copied from Railway, never committed)
# /opt/mrflix/db.env  MySQL credentials generated by server-bootstrap.sh;
#                   loaded last so its DATABASE_* values win over .env
name: mrflix

services:
  mysql:
    image: mysql:9.7 # same major/minor as Railway, so the dump imports cleanly
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    # Only reachable from the server itself (SSH tunnel to port 3312 for a DB GUI).
    ports:
      - "127.0.0.1:3312:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mrflix-be:latest
    restart: unless-stopped
    env_file:
      - ${MRFLIX_ENV_FILE:-/opt/mrflix/.env}
      - ${MRFLIX_DB_ENV_FILE:-/opt/mrflix/db.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "1337"
      DATABASE_CLIENT: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_SSL: "false"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/opt/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      internal:
      web:
        aliases: [mrflix-app] # Caddy proxies to mrflix-app:1337
    logging: *logging

volumes:
  mysql-data:
  uploads:

networks:
  internal:
  web:
    external: true
    name: web
